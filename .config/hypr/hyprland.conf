env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_STYLE_OVERRIDE,kvantum
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_PLUGIN_PATH,/usr/lib/qt/plugins

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DBUS_REMOTE,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XCURSOR_THEME,Bibata-Modern-Classic-TotalPurple
env = XCURSOR_SIZE,14

exec-once = swaync
# exec-once = while true; do mpvpaper -o "--hwdec=auto-safe --vo=gpu-next --profile=fast --panscan=1.0 --loop --no-audio" DP-2 ~/.config/hypr/wallpapers/output.mp4; sleep 7200; killall mpvpaper; done
exec-once = hyprpaper
exec-once = waybar
# exec-once = cairo-dock --opengl
exec-once = hyprctl setcursor Bibata-Modern-Classic-TotalPurple 14
exec-once = hyprctl keyword vsync 1
exec-once = swayosd-server --top-margin 0.95

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
}

general {
    gaps_in = 8
    gaps_out = 15
    border_size = 0
    col.active_border = 0x806C57FF
    col.inactive_border = 0
    layout = dwindle
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    disable_splash_rendering = true
    vrr = true
}

decoration {
    rounding = 26
    
    shadow {
        enabled = false
    }
    
    blur {
        enabled = true
        size = 6
        passes = 2
        noise = 0.0117
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.5
        vibrancy_darkness = 0.5

        ignore_opacity = true
        xray = false
        
        special = true
        new_optimizations = true

        popups = true
        popups_ignorealpha = 0.2
    }
    
    active_opacity = 0.85
    inactive_opacity = 0.85
}

dwindle {
    preserve_split = yes
}

misc {
    animate_manual_resizes = no 
}

xwayland {
    force_zero_scaling = true
}

bind = SUPER, TAB, exec, rofi -show drun
bind = SUPER, Q, killactive
bind = SUPER, Return, exec, kitty
bind = SUPER, F, fullscreen

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

binde = SUPER, equal, exec, swayosd-client --output-volume raise
binde = SUPER, minus, exec, swayosd-client --output-volume lower
bind = SUPER, Z, exec, swayosd-client --output-volume mute-toggle

bind = SUPER, U, layoutmsg, togglesplit

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u 
bind = SUPER SHIFT, J, movewindow, d

bind = SUPER, T, pseudo

bind = SUPER SHIFT, Z, exec, swayosd-client --input-volume mute-toggle
bind = SUPER, G, exec, hyprctl dispatch togglefloating && hyprctl dispatch resizeactive exact 1800 1100 && hyprctl dispatch centerwindow

bind = SUPER, X, exec, grim -g "$(slurp)" -t png - | tee "$HOME/Screenshots/$(date +%F-%T).png" | wl-copy --type image/png
bind = SUPER SHIFT, X, exec, grim -g "$(slurp)" -t png - | wl-copy --type image/png

bind = SUPER SHIFT, R, exec, ~/.config/hypr/scripts/recording.sh
bind = SUPER SHIFT, N, exec, swaync-client -t

binde = SUPER ALT, l, resizeactive, 30 0
binde = SUPER ALT, h, resizeactive, -30 0
binde = SUPER ALT, k, resizeactive, 0 -30
binde = SUPER ALT, j, resizeactive, 0 30

animations {
   enabled = 1

   bezier = default,  0.05, 0.9,  0.1,  1.05
   bezier = wind,     0.05, 0.9,  0.1,  1.05
   bezier = overshot, 0.13, 0.99, 0.29, 1.08
   bezier = liner,    1,    1,    1,    1

   animation = windows,        1, 8, wind,     popin
   animation = windowsIn,      1,  8, overshot, popin
   animation = windowsOut,     1, 8, overshot, popin
   animation = windowsMove,    1,  8, overshot, slide

   animation = layers,         1,  9, default,  popin

   animation = fadeIn,         1, 8, default
   animation = fadeOut,        1, 8, default
   animation = fadeSwitch,     1, 8, default
   animation = fadeShadow,     1, 8, default
    animation = fadeDim,        1, 8, default
    animation = fadeLayers,     1, 8, default

    animation = workspaces,     1, 8, overshot, slidevert

    animation = border,         1,  1, liner
    animation = borderangle,    1, 30, liner, loop

    animation = specialWorkspace, 1, 7, overshot, slidevert
}


windowrule {
    name = kitty_opaque
    match:class = kitty
    opaque = on
}

windowrule {
    name = vpn_window
    match:class = AmneziaVPN
    float = on
}

layerrule {
    name = waybar_blur
    match:namespace = waybar
    blur = on
    ignore_alpha = 0
    no_anim = on
}

layerrule {
    name = hyprpicker_noanim
    match:namespace = hyprpicker
    no_anim = on
}

layerrule {
    name = selection_noanim
    match:namespace = selection
    no_anim = on
}

layerrule {
    name = rofi_blur
    match:namespace = rofi
    blur = on
}

layerrule {
    name = swaync_notification_blur
    match:class = swaync-notification-window
    blur = on
}

layerrule {
    name = swaync_control_blur
    match:class = swaync-control-center
    blur = on
}

layerrule {
    name = cairo_dock_blur
    match:class = cairo-dock
    blur = on
    ignore_alpha = 0.3
}

layerrule {
    name = hyprpaper
    match:namespace = hyprpaper
    blur = off
    no_anim = on
}

layerrule {
    name = swayosd
    match:namespace = swayosd
    blur = on
}

windowrule {
    name = dota_cap
    match:class = dota2
    opaque = on
}
